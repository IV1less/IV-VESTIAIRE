<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IV VESTIAIRE</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffffff'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='36' fill='%23000000'%3EIV%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--tile:#fff;--ink:#111;--dim:#8b8b87;--line:#cfcfcb;--f:"Helvetica Neue",Helvetica,Arial,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:11px/1.55 var(--f);letter-spacing:.03em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-align:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
body.lock{overflow:hidden}
@media(hover:hover){a:hover{opacity:.45}.btn:hover{background:#fff;color:var(--ink)}}

.loader{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;padding:20px 20px calc(20px + var(--sab));transition:opacity .6s ease .15s,visibility 0s .8s}
.loader.done{opacity:0;visibility:hidden}
.loader b{font-weight:400;font-size:clamp(56px,16vw,160px);line-height:.8;letter-spacing:-.04em}

.bar{position:fixed;inset:0 0 auto 0;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(52px + var(--sat));padding:var(--sat) 20px 0;background:#fff;border-bottom:1px solid var(--line)}
.c{letter-spacing:.4em;text-indent:.4em;font-weight:700;font-size:13px}
.r{justify-self:end}
.btn{display:inline-block;background:var(--ink);color:#fff;border:1px solid var(--ink);font-weight:700;font-size:12px;line-height:1;letter-spacing:.06em;padding:10px 16px;white-space:nowrap}

.hero{padding:calc(60px + var(--sat)) 0 8px;border-bottom:1px solid var(--line);overflow:hidden}
.wall{display:flex;flex-direction:column}
.line{height:clamp(38px,5.6vw,54px);display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:clamp(16px,2.3vw,26px);line-height:1;letter-spacing:-.02em;color:#a3a39e}
.line .tr{flex:none;animation:tick var(--d,60s) linear infinite}
.line:nth-child(even) .tr{animation-direction:reverse}
.line.brand{justify-content:center;color:var(--ink);font-weight:700;font-size:clamp(24px,3.8vw,40px);letter-spacing:.02em;height:clamp(64px,9vw,88px)}
.line a,.line span{margin-right:2.2em}
.line a{transition:color .15s}
.line em{font-style:normal;font-size:.46em;letter-spacing:.04em;color:var(--dim);margin-right:.9em;vertical-align:.25em}
@media(hover:hover){.line:hover .tr{animation-play-state:paused}.line a:hover{color:#000;opacity:1}.line a:hover em{color:#000}}
@keyframes tick{to{transform:translateX(-50%)}}

.shop{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);max-width:820px;margin:48px auto calc(60px + var(--sab))}
@media(min-width:760px){.shop{grid-template-columns:1fr 1fr}}
@media(max-width:759px){.shop{margin-top:0;border-top:1px solid var(--line)}}
.tile{background:var(--bg);display:block;width:100%}
.tile .ph{position:relative;aspect-ratio:1/1;background:var(--tile);overflow:hidden}
.tile .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);filter:grayscale(.9) brightness(.95)}
.tile .ph img+img{opacity:0}
.tile.alt .ph img:first-child{opacity:0}.tile.alt .ph img+img{opacity:1}
@media(hover:hover){.tile:hover .ph img:first-child{opacity:0}.tile:hover .ph img+img{opacity:1;transform:scale(1.03)}}
.tile .m{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 20px 22px}
.tile .m span:last-child{color:var(--dim);text-align:right}
.rn{font-size:15px;letter-spacing:.12em}

.contact{position:fixed;inset:0;z-index:600;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.contact.open{opacity:1;visibility:visible;transition:opacity .3s}
.cbox{width:min(100%,420px);background:#fff;border:1px solid var(--line);padding:0 20px}
.cbox .ch{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.cbox .ch>span{color:var(--dim)}
.cbox a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 0;border-top:1px solid var(--line);font-size:20px;letter-spacing:-.01em}
.cbox a span{font-size:11px;color:var(--dim);letter-spacing:.03em}

/* exhibition page */
.page{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateY(100%);visibility:hidden;transition:transform .7s cubic-bezier(.7,0,.2,1),visibility 0s .7s}
.page.open{transform:none;visibility:visible;transition:transform .7s cubic-bezier(.7,0,.2,1)}
.page .top{position:fixed;inset:0 0 auto 0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(52px + var(--sat));padding:var(--sat) 20px 0;background:#fff;border-bottom:1px solid var(--line)}
.page .wrap{display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
.page .info{order:-1;padding:calc(74px + var(--sat)) 20px 22px}
.page h2{font:400 clamp(32px,9vw,40px)/1 var(--f);letter-spacing:.06em;margin:0 0 14px}
.page p{margin:0 0 6px;color:var(--dim);max-width:34ch}
.page .imgs{display:flex;flex-direction:column;gap:2px;padding-bottom:var(--sab)}
.page .row{display:flex;gap:2px}
.page .row button{display:block;min-width:0;background:var(--tile);overflow:hidden}
.page .row img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.9)}
@media(hover:hover){.page .row button:hover img{filter:none}}
@media(min-width:900px){
  .page .wrap{flex-direction:row;align-items:flex-start}
  .page .imgs{flex:1;min-width:0;margin-top:68px}
  .page .info{order:0;width:280px;position:sticky;top:0;padding-top:78px}
}

/* zoom */
.zoom{position:fixed;inset:0;z-index:500;background:#fff;display:none;overflow:hidden;cursor:zoom-in;touch-action:none}
.zoom.open{display:block}
.zoom img{position:absolute;inset:0;margin:auto;max-width:min(94vw,720px);max-height:80vh;max-height:80svh;transition:transform .35s ease;user-select:none;-webkit-user-drag:none}
.zoom.in{cursor:zoom-out}
.zoom .n{position:absolute;bottom:calc(20px + var(--sab));left:0;right:0;text-align:center;color:var(--dim);pointer-events:none}
.zoom .x{position:absolute;top:calc(var(--sat) + 10px);right:20px;z-index:2}
.zoom .arr{position:absolute;top:50%;color:#000;z-index:2;padding:20px;font-size:22px}
.zoom .l{left:0}.zoom .rr{right:0}
@media(hover:none){.zoom .arr{display:none}}

.cur{position:fixed;left:0;top:0;z-index:999;pointer-events:none;mix-blend-mode:difference;color:#fff;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .2s}
.cur.on{opacity:1}
.cur::before{content:"";display:inline-block;width:6px;height:6px;background:#fff;border-radius:50%;margin-right:8px;vertical-align:middle}
@media(hover:none){.cur{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.line{overflow-x:auto}}
html,body{max-width:100%;overflow-x:hidden}
.line[hidden]{display:none}
@media(max-width:600px){
  .line{height:42px;font-size:17px}
  .line.brand{height:68px;font-size:26px}
  .tile .m{flex-wrap:wrap;padding:12px 16px 18px}
  .cbox a{font-size:18px}
  .page .info{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>

<div class="loader" id="loader"><span>iv vestiaire</span><b id="pct">0</b></div>
<div class="cur" id="cur"></div>

<header class="bar">
  <span></span>
  <a class="c" href="#top">IV</a>
  <button class="r btn" id="cOpen" aria-haspopup="dialog">contact</button>
</header>

<section class="hero" id="top"><div class="wall" id="wall"><div class="line brand">IV = DESIGN</div></div></section>

<section class="shop" id="shop">
  <button class="tile" data-open="1" data-cur="open" aria-label="Open exhibition I">
    <div class="ph">
      <img src="https://i.postimg.cc/SNrn9SWC/20260205-122714(1).jpg" alt="Exhibition I">
      <img src="https://i.postimg.cc/Nf4KXs1b/2.png" alt="">
    </div>
    <div class="m"><span class="rn">I</span><span>moscow, locker room, 2026</span></div>
  </button>
  <button class="tile" data-open="2" data-cur="open" aria-label="Open exhibition II">
    <div class="ph">
      <img src="https://i.postimg.cc/g2h8ZF2m/3.png" alt="Exhibition II">
      <img src="https://i.postimg.cc/vmd97q4V/20260205-143140-(2).jpg" alt="">
    </div>
    <div class="m"><span class="rn">II</span><span>moscow, locker room, 2026</span></div>
  </button>
</section>

<div class="contact" id="contactDlg" role="dialog" aria-modal="true" aria-label="Contact" aria-hidden="true">
  <div class="cbox">
    <div class="ch"><span>write me</span><button class="btn" id="cClose">close</button></div>
    <a href="https://t.me/zheezhou" target="_blank" rel="noopener">telegram<span>@zheezhou</span></a>
    
  </div>
</div>

<div class="page" id="page" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="top"><span></span><span class="c">IV</span><button id="pClose" class="r btn">close</button></div>
  <div class="wrap">
    <div class="imgs" id="imgs"></div>
    <aside class="info"><h2 id="pTitle"></h2><p id="pSub"></p><p id="pNote"></p></aside>
  </div>
</div>

<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Zoom">
  <button class="x btn" id="zClose" data-cur="close">close</button>
  <button class="arr l" id="zPrev" aria-label="Previous">&lsaquo;</button>
  <img id="zImg" alt="">
  <button class="arr rr" id="zNext" aria-label="Next">&rsaquo;</button>
  <div class="n" id="zN"></div>
</div>

<script>
const EX={
 1:{t:"I",s:"moscow, locker room, 2026",n:"first presentation",im:["https://i.postimg.cc/Nf4KXs1b/2.png","https://i.postimg.cc/m2wP9LQj/20260205-122345.jpg","https://i.postimg.cc/SNrn9SWC/20260205-122714(1).jpg","https://i.postimg.cc/DyFWmJbK/4.png","https://i.postimg.cc/Hxw648WQ/1.png","https://i.postimg.cc/KzS9MDbz/20260205-122542.jpg","https://i.postimg.cc/k4Bzdvm1/8.png","https://i.postimg.cc/NM5Swkcp/854.png"]},
 2:{t:"II",s:"moscow, locker room, 2026",n:"second iteration",im:["https://i.postimg.cc/vmd97q4V/20260205-143140-(2).jpg","https://i.postimg.cc/BnFHK9nx/20260205-143447-(2).jpg","https://i.postimg.cc/xdSHGxXv/20260205-143640-(2).jpg","https://i.postimg.cc/g2h8ZF2m/3.png"]}
};
const $=i=>document.getElementById(i);
let cur=null,zi=0,last=null,ars=[],btns=[];

/* loader */
(function(){
  const el=$("pct"),L=$("loader"),end=()=>{L.classList.add("done");document.body.classList.add("ready")};
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=100;return end()}
  let n=0;const iv=setInterval(()=>{n+=Math.ceil(Math.random()*9);if(n>=100){n=100;clearInterval(iv);setTimeout(end,250)}el.textContent=n},55);
})();

/* wall of running lines: brand line + headlines straight from fashion magazine feeds */
const FEEDS=[
 ["vogue","https://www.vogue.com/feed/rss"],
 ["wwd","https://wwd.com/feed/"],
 ["hypebeast","https://hypebeast.com/feed"],
 ["highsnobiety","https://www.highsnobiety.com/feed/"]
];
const HOT=/louis vuitton|vuitton|\blvmh\b|dior|chanel|prada|balenciaga|gucci|herm[eè]s|saint laurent|loewe|kanye|yeezy|\bye\b|bianca censori/i;
const xml=t=>[...new DOMParser().parseFromString(t,"text/xml").querySelectorAll("item,entry")].map(i=>{
  const l=i.querySelector("link");return[((i.querySelector("title")||{}).textContent||"").trim(),l?(l.getAttribute("href")||l.textContent||"").trim():""]});
async function pull(u){
  const tries=[
    async()=>{const j=await(await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u))).json();if(j.status!=="ok")throw 0;return j.items.map(x=>[x.title,x.link])},
    async()=>xml(await(await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(u))).text()),
    async()=>xml(await(await fetch("https://corsproxy.io/?"+encodeURIComponent(u))).text())
  ];
  for(const t of tries){try{const r=await t();if(r.length)return r}catch(e){}}
  return [];
}
const wall=$("wall");
function mkLine(cls){const d=document.createElement("div");d.className="line"+(cls?" "+cls:"");d.hidden=!!(cls!=="brand");const t=document.createElement("div");t.className="tr";d.appendChild(t);wall.appendChild(d);return t}
function fill(tr,items,speed){
  const frag=()=>{const f=document.createDocumentFragment();items.forEach(([n,t,l])=>{
    const el=document.createElement(l&&/^https?:/.test(l)?"a":"span");
    if(el.tagName==="A"){el.href=l;el.target="_blank";el.rel="noopener"}
    if(n){const e=document.createElement("em");e.textContent=n;el.appendChild(e)}
    el.append(t);f.appendChild(el)});return f};
  tr.parentNode.hidden=false;
  tr.textContent="";tr.append(frag(),frag());
  for(let k=0;k<8&&tr.offsetWidth/2<innerWidth*1.05;k++)tr.append(frag(),frag());
  tr.style.setProperty("--d",Math.max(45,tr.offsetWidth/2/speed)+"s");
}
const hotTr=mkLine("hot"),feedTr=FEEDS.map(()=>mkLine("hot")),byFeed={};
function refreshHot(){
  const seen=new Set(),m=[];
  Object.values(byFeed).flat().forEach(x=>{const k=x[1].toLowerCase().slice(0,40);if(HOT.test(x[1])&&!seen.has(k)){seen.add(k);m.push(x)}});
  if(m.length>=2)fill(hotTr,m.slice(0,12),18);
}
FEEDS.forEach(async([name,url],i)=>{
  const key="iv-feed-"+name,speed=15+i*3;
  try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&c.length){byFeed[name]=c;fill(feedTr[i],c,speed);refreshHot()}}catch(e){}
  const items=(await pull(url)).map(([t,l])=>[name,t,l]).filter(x=>x[1]&&/^https?:/.test(x[2])).slice(0,10);
  if(!items.length)return;
  byFeed[name]=items;fill(feedTr[i],items,speed);refreshHot();
  try{localStorage.setItem(key,JSON.stringify(items))}catch(e){}
});

/* contact window */
const cd=$("contactDlg");
function setC(on){cd.classList.toggle("open",on);cd.setAttribute("aria-hidden",on?"false":"true");document.body.classList.toggle("lock",on);if(on)$("cClose").focus();else $("cOpen").focus()}
$("cOpen").onclick=()=>setC(true);
$("cClose").onclick=()=>setC(false);
cd.addEventListener("click",e=>{if(e.target===cd)setC(false)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&cd.classList.contains("open"))setC(false)});

/* tap devices: no hover, so crossfade tiles by themselves */
if(matchMedia("(hover:none)").matches)setInterval(()=>document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("alt")),3200);

/* cursor label */
const C=$("cur"),zoom=$("zoom"),zImg=$("zImg");
addEventListener("mousemove",e=>{
  C.style.transform=`translate(${e.clientX+14}px,${e.clientY-8}px)`;
  const t=e.target.closest("[data-cur]");
  if(t){C.textContent=t.dataset.cur;C.classList.add("on")}
  else if(zoom.classList.contains("open")){C.textContent=zoom.classList.contains("in")?"out":"zoom";C.classList.add("on")}
  else C.classList.remove("on");
});

/* justified rows: every row is filled edge to edge, no holes */
function layout(){
  const box=$("imgs"),W=box.clientWidth;if(!W||!ars.length)return;
  const G=2,T=W<600?270:300,H=r=>(W-G*(r.length-1))/r.reduce((s,i)=>s+ars[i],0);
  const rows=[];let row=[],sum=0;
  ars.forEach((a,i)=>{row.push(i);sum+=a;if(sum*T+G*(row.length-1)>=W){rows.push(row);row=[];sum=0}});
  if(row.length)rows.push(row);
  if(rows.length>1&&H(rows[rows.length-1])>T*1.4){const l=rows.pop();rows[rows.length-1]=rows[rows.length-1].concat(l)}
  box.textContent="";
  rows.forEach(r=>{const d=document.createElement("div");d.className="row";d.style.height=H(r)+"px";
    r.forEach(i=>{btns[i].style.flex=ars[i]+" 1 0";d.appendChild(btns[i])});box.appendChild(d)});
}
let rq;addEventListener("resize",()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(layout)});

const page=$("page");
function ratio(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth/i.naturalHeight||.75);i.onerror=()=>r(.75);i.src=src})}
async function openPage(k,trg){
  cur=EX[k];last=trg;
  $("pTitle").textContent=cur.t;$("pSub").textContent=cur.s;$("pNote").textContent=cur.n;
  $("imgs").textContent="";
  page.classList.add("open");page.setAttribute("aria-hidden","false");page.scrollTop=0;
  document.body.classList.add("lock");$("pClose").focus();
  const mine=cur;
  const a=await Promise.all(mine.im.map(ratio));
  if(cur!==mine)return;
  ars=a;
  btns=mine.im.map((src,i)=>{const b=document.createElement("button");b.dataset.cur="zoom";b.setAttribute("aria-label","Zoom image "+(i+1));
    const im=document.createElement("img");im.src=src;im.alt="";b.appendChild(im);b.onclick=()=>openZoom(i);return b});
  layout();
}
function closePage(){page.classList.remove("open");page.setAttribute("aria-hidden","true");document.body.classList.remove("lock");last&&last.focus()}
document.querySelectorAll("[data-open]").forEach(t=>t.onclick=()=>openPage(t.dataset.open,t));
$("pClose").onclick=closePage;

/* zoom */
const setO=(x,y)=>{
  const w=zImg.offsetWidth,h=zImg.offsetHeight;
  const px=Math.min(1,Math.max(0,(x-zImg.offsetLeft)/w)),py=Math.min(1,Math.max(0,(y-zImg.offsetTop)/h));
  zImg.style.transformOrigin=px*100+"% "+py*100+"%";
};
function setZ(i){
  zi=(i+cur.im.length)%cur.im.length;zImg.src=cur.im[zi];
  zoom.classList.remove("in");zImg.style.transform="";zImg.style.transformOrigin="50% 50%";
  $("zN").textContent=(zi+1)+" / "+cur.im.length;
}
function openZoom(i){setZ(i);zoom.classList.add("open");$("zClose").focus()}
function closeZoom(){zoom.classList.remove("open","in")}
zImg.onclick=e=>{const on=!zoom.classList.contains("in");if(on)setO(e.clientX,e.clientY);zoom.classList.toggle("in",on);zImg.style.transform=on?"scale(2.4)":""};
zoom.addEventListener("mousemove",e=>{if(zoom.classList.contains("in"))setO(e.clientX,e.clientY)});
zoom.addEventListener("touchmove",e=>{if(zoom.classList.contains("in"))setO(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
$("zClose").onclick=closeZoom;
$("zPrev").onclick=()=>setZ(zi-1);$("zNext").onclick=()=>setZ(zi+1);

addEventListener("keydown",e=>{
  if(zoom.classList.contains("open")){
    if(e.key==="Escape")closeZoom();else if(e.key==="ArrowLeft")setZ(zi-1);else if(e.key==="ArrowRight")setZ(zi+1);
  }else if(page.classList.contains("open")&&e.key==="Escape")closePage();
});
let sx=null;
zoom.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
zoom.addEventListener("touchend",e=>{
  if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;
  if(!zoom.classList.contains("in")&&Math.abs(d)>50)setZ(zi+(d<0?1:-1));
},{passive:true});
</script>
</body>
</html>
